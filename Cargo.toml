[package]
name = "acp-gateway"
version = "0.1.0"
edition = "2024"
description = "Unified MCP Streamable HTTP and REST/SSE gateway wrapping any ACP coding agent."

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["now"] }
dotenvy = "0.15"
futures-core = "0.3"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
